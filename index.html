<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MDUYK REDEEM</title>
<style>
body { background: #0b090a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.panel { background: #151113; border: 1px solid #38282d; padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; width: 90%; }
button { background: #a91f2b; color: white; border: none; padding: 15px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }
button:disabled { background: #555; }
.result { display: none; margin-top: 15px; background: #10251c; border: 1px solid #28513f; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 18px; color: #61c995; }
</style>
</head>
<body>
<div class="panel">
    <h1>MDUYK REDEEM</h1>
    <p id="desc">Bấm nút bên dưới để lấy tài khoản.</p>
    <button id="btnGet">LẤY ACC NGAY →</button>
    <div class="result" id="resultBox"></div>
</div>

<script>
// THAY LINK RENDER VÀO ĐÂY
const API_URL = "https://ten-bot-cua-ban.onrender.com/api/get_acc";
let token = "";

let url = window.location.href;
if (url.includes("MDUYK-")) {
    let parts = url.split("MDUYK-");
    token = "MDUYK-" + parts[1].split("&")[0].split("/")[0];
} else {
    document.getElementById('desc').innerText = "Link không hợp lệ!";
    document.getElementById('btnGet').disabled = true;
}

document.getElementById('btnGet').onclick = function() {
    this.disabled = true;
    this.textContent = 'ĐANG LẤY...';
    
    fetch(`${API_URL}?token=${token}`)
    .then(res => res.json())
    .then(data => {
        if (data.status === "success") {
            document.getElementById('resultBox').innerHTML = `Tài khoản: <b>${data.user} | ${data.pass}</b><br><br><span style="color:red; font-size:12px;">Hãy gửi mã này vào Bot Telegram để hoàn tất!</span>`;
            document.getElementById('resultBox').style.display = "block";
            this.textContent = 'ĐÃ LẤY ACC';
            document.getElementById('desc').style.display = "none";
        } else {
            // Nếu khách ấn F5 hoặc load lại, nó sẽ rơi vào đây
            document.getElementById('resultBox').innerHTML = `<span style="color:red;">${data.message}</span>`;
            document.getElementById('resultBox').style.display = "block";
            this.textContent = 'LỖI';
            document.getElementById('desc').style.display = "none";
        }
    })
    .catch(err => {
        alert("Lỗi kết nối mạng!");
        this.disabled = false;
        this.textContent = 'THỬ LẠI →';
    });
};
</script>
</body>
</html>
