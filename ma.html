<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MDUYK REDEEM</title>
<style>
:root{--bg:#0b090a;--panel:#151113;--red:#a91f2b;--line:#38282d;--text:#f6eef0;--muted:#b7a8ac}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;max-width:400px;width:90%;text-align:center}
h1{font-size:24px;margin:10px 0}.muted{color:var(--muted);font-size:14px;line-height:1.6}
.btn{background:var(--red);color:white;padding:14px;width:100%;border:none;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer;margin-top:20px;text-decoration:none;display:block}
.btn:active{background:#8a1923}
.result{display:none;margin-top:15px;background:#10251c;border:1px solid #28513f;padding:15px;border-radius:10px}
.credential{font:14px monospace;background:#0a1510;padding:12px;border-radius:8px;margin-top:9px;border:1px solid #28513f;word-break:break-all}
</style>
</head>
<body>
<div class="panel">
    <h1>MDUYK ACCOUNT</h1>
    <p class="muted" id="desc">Nhấn nút bên dưới để lấy tài khoản.</p>
    <button class="btn" id="actionBtn">LẤY ACC NGAY →</button>
    <div class="result" id="resultBox">
        <b style="color:#61c995;">✓ Tài khoản của bạn đây:</b>
        <div class="credential" id="accText"></div>
        <p class="muted" style="margin-top:10px;font-size:12px;">Hệ thống tự chuyển hướng sau 3 giây...</p>
    </div>
</div>

<script>
const FIREBASE_URL = "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/";
let token = "";


let url = window.location.href;
if (url.includes("MDUYK-")) {
    let parts = url.split("MDUYK-");
    token = "MDUYK-" + parts[1].split("/")[0];
} else {
    token = "MDUYK-" + Math.random().toString(36).substring(2, 8).toUpperCase();
    window.history.replaceState(null, '', window.location.pathname + "/" + token);
}


document.getElementById('actionBtn').onclick = function() {
    let btn = this;
    btn.disabled = true;
    btn.textContent = 'ĐANG LẤY...';
    
    fetch(FIREBASE_URL + "links/" + token + ".json")
    .then(res => res.json())
    .then(tokenData => {
        if (tokenData && tokenData.used) {
            throw new Error("Mã này đã bị vô hiệu hóa!");
        }
        
        return fetch(FIREBASE_URL + "inventory.json");
    })
    .then(res => res.json())
    .then(invData => {
        let accKey = null, accData = null;
        for (let key in invData) {
            if (!invData[key].used) { accKey = key; accData = invData[key]; break; }
        }
        if (!accData) throw new Error("Kho đã hết acc!");

    
        fetch(FIREBASE_URL + "links/" + token + ".json", { method: 'PUT', body: JSON.stringify({used: true}) });
        fetch(FIREBASE_URL + "inventory/" + accKey + "/used.json", { method: 'PUT', body: 'true' });

        
        document.getElementById('accText').textContent = accData.user + " | " + accData.pass;
        document.getElementById('resultBox').style.display = "block";
        btn.textContent = 'ĐÃ LẤY ACC';

    
        return fetch(FIREBASE_URL + "config.json");
    })
    .then(res => res.json())
    .then(cfg => {
        if (cfg && cfg.redirectUrl) {
            setTimeout(() => { window.location.href = cfg.redirectUrl; }, 3000);
        }
    })
    .catch(err => {
        alert(err.message);
        btn.textContent = 'LỖI HOẶC HẾT HẠN';
    });
};
</script>
</body>
</html>
