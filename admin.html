<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NHIỆM VỤ - MDUYK</title>
<style>
:root{--bg:#0b090a;--panel:#151113;--red:#a91f2b;--line:#38282d;--text:#f6eef0;--muted:#b7a8ac}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;max-width:400px;width:90%;text-align:center}
h1{font-size:24px;margin:10px 0}.muted{color:var(--muted);font-size:14px;line-height:1.6}
.btn{background:var(--red);color:white;padding:14px;width:100%;border:none;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer;margin-top:20px;text-decoration:none;display:block}
.btn:active{background:#8a1923}
.steps{text-align:left;background:#0d0a0b;padding:15px;border-radius:10px;margin-top:20px;font-size:13px;border:1px solid var(--line)}
</style>
</head>
<body>

<div class="panel">
    <h1>LÀM NHIỆM VỤ</h1>
    <p class="muted">Vui lòng làm theo các bước dưới đây để vượt link và lấy tài khoản.</p>
    
    <div class="steps">
        <p>1. Bấm vào nút bên dưới để truy cập trang nhiệm vụ.</p>
        <p>2. Chờ 15 giây và làm theo hướng dẫn.</p>
        <p>3. Bấm quay lại để nhận tài khoản.</p>
    </div>

    <!-- NÚT NÀY BẠN CÓ THỂ GẮN LINK NHIỆM VỤ THỰC TẾ CỦA BẠN VÀO -->
    <a href="https://zalo.me/g/group-cua-ban" target="_blank" class="btn" id="taskLink">BẤM VÀO ĐÂY ĐỂ LÀM NHIỆM VỤ</a>
    
    <button class="btn" id="finishBtn" style="background:#28513f; margin-top:10px;">TÔI ĐÃ LÀM XONG →</button>
</div>

<script>
// Lấy Token được gửi từ bên index.html sang
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

// Nếu không có token, đá về trang chủ
if (!token) {
    window.location.href = "/"; 
}

document.getElementById('finishBtn').onclick = function() {
    // Sau khi bấm xong, đá khách về index.html kèm mã token
    // Cấu trúc: mduy.com/#/MDUYK-XXXX
    window.location.href = window.location.origin + window.location.pathname.replace('ma.html', '') + "#/" + token;
};
</script>

</body>
</html>
